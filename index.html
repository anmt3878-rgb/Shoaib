<!-- ================= LOGIN PAGE ================= -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo">

            <div class="logo-icon">
                🛡️
            </div>

            <h2>
                Shield<span>X</span>
            </h2>

        </div>

        <h1>
            LOGIN
        </h1>

        <p class="login-sub">
            Enter your credentials to access the cybersecurity dashboard.
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                class="login-btn"
                type="submit"
            >
                LOGIN
            </button>


            <div
                class="login-error"
                id="loginError"
            >
                Incorrect email or password.
            </div>

        </form>


        <div class="demo-info">

            <strong>
                Demo Account
            </strong>

            <br><br>

            Email: admin@shieldx.demo

            <br>

            Password: ShieldX2026

        </div>

    </div>

</div>
